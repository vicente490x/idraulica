  /api/v1/interventions/:
    get:
      operationId: interventions_list
      parameters:
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
      - in: query
        name: end
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - normal
          - urgent
        description: |-
          * `normal` - Normale
          * `high` - Alta
          * `urgent` - Urgente
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date-time
      - in: query
        name: status
        schema:
          type: string
          enum:
          - absent
          - assigned
          - cancelled
          - completed
          - confirmed
          - reschedule
          - scheduled
          - travelling
          - working
        description: |-
          * `scheduled` - Programmato
          * `assigned` - Assegnato
          * `confirmed` - Confermato
          * `travelling` - In viaggio
          * `working` - In lavorazione
          * `completed` - Completato
          * `absent` - Cliente assente
          * `cancelled` - Annullato
